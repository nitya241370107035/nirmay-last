<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Nirāmay – Virtual Hospital | નિરામય સ્માર્ટ ક્લિનિક</title>
    
    <!-- Google Fonts with Non-Blocking Asynchronous Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&family=Noto+Sans+Gujarati:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0F3835" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nirāmay" />
    
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <style>
      /* Inline critical splash styling for instant load */
      #splash-loader {
        position: fixed;
        inset: 0;
        background-color: #F4F7F6;
        color: #0F3835;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 99999;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans Gujarati', sans-serif;
      }
      .splash-pulse {
        animation: pulseGlow 1.4s infinite ease-in-out;
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.04); opacity: 1; filter: drop-shadow(0 6px 16px rgba(30,107,99,0.25)); }
      }
    </style>
  </head>
  <body class="bg-[#F4F7F6] text-[#1A2B2B] antialiased selection:bg-[#2E7D73] selection:text-white">
    <!-- Instant Native Splash Screen -->
    <div id="splash-loader">
      <div class="splash-pulse text-center">
        <div style="width: 88px; height: 96px; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px;">
          <img src="/logo.png" alt="Nirāmay Logo" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 8px 16px rgba(15,56,53,0.25));" />
        </div>
        <h1 style="font-size: 24px; font-weight: 800; color: #0F3835; letter-spacing: -0.5px; margin: 0 0 2px;">નિરામય</h1>
        <p style="font-size: 13px; color: #1E6B63; margin: 0; font-weight: 700;">ગામનું ડિજિટલ ક્લિનિક • Nirāmay Clinic</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
