<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" rx="16" fill="#F4F8F7"/>
  <g transform="translate(40, 30)">
    <rect x="0" y="0" width="520" height="240" rx="16" fill="#E0F2F1" stroke="#2E7D73" stroke-width="2"/>
    <text x="260" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1B4D4A" text-anchor="middle">6 Steps of Thorough Handwashing (20 Seconds)</text>
    <g transform="translate(30, 60)">
      <!-- Step 1 -->
      <circle cx="50" cy="50" r="35" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="50" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B4D4A" text-anchor="middle">1. Palms</text>
      <text x="50" y="62" font-family="sans-serif" font-size="10" fill="#2E7D73" text-anchor="middle">Rub together</text>
      <!-- Step 2 -->
      <circle cx="150" cy="50" r="35" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="150" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B4D4A" text-anchor="middle">2. Back</text>
      <text x="150" y="62" font-family="sans-serif" font-size="10" fill="#2E7D73" text-anchor="middle">Over hands</text>
      <!-- Step 3 -->
      <circle cx="250" cy="50" r="35" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="250" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B4D4A" text-anchor="middle">3. Fingers</text>
      <text x="250" y="62" font-family="sans-serif" font-size="10" fill="#2E7D73" text-anchor="middle">Interlaced</text>
      <!-- Step 4 -->
      <circle cx="350" cy="50" r="35" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="350" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B4D4A" text-anchor="middle">4. Thumbs</text>
      <text x="350" y="62" font-family="sans-serif" font-size="10" fill="#2E7D73" text-anchor="middle">Rotated</text>
      <!-- Step 5 -->
      <circle cx="100" cy="140" r="35" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="100" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B4D4A" text-anchor="middle">5. Wrists</text>
      <text x="100" y="152" font-family="sans-serif" font-size="10" fill="#2E7D73" text-anchor="middle">And nails</text>
      <!-- Step 6 -->
      <circle cx="300" cy="140" r="35" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="300" y="135" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1B4D4A" text-anchor="middle">6. Rinse</text>
      <text x="300" y="152" font-family="sans-serif" font-size="10" fill="#2E7D73" text-anchor="middle">Running water</text>
    </g>
  </g>
</svg>
