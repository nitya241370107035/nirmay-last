      <text x="105" y="140" font-family="sans-serif" font-size="28" text-anchor="middle">🧼</text>

      <rect x="250" y="0" width="210" height="170" rx="12" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="355" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="middle">Anti-Rabies Doses</text>
      <text x="355" y="60" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Day 0, 3, 7, 14, 28</text>
      <text x="355" y="80" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Free ARV at PHC</text>
      <text x="355" y="140" font-family="sans-serif" font-size="28" text-anchor="middle">💉</text>
    </g>
