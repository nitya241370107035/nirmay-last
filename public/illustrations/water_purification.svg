<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" rx="16" fill="#F4F8F7"/>
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="540" height="260" rx="16" fill="#E0F2F1" stroke="#2E7D73" stroke-width="2"/>
    <text x="270" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1B4D4A" text-anchor="middle">Water Purification: Boil 10 Mins or Chlorine</text>
    <g transform="translate(40, 60)">
      <rect x="0" y="0" width="210" height="170" rx="12" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="105" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B4D4A" text-anchor="middle">Boil 10 Minutes</text>
      <text x="105" y="60" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Continuous Rolling Boil</text>
      <text x="105" y="80" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Cool Covered &amp; Use Ladle</text>
      <text x="105" y="140" font-family="sans-serif" font-size="28" text-anchor="middle">🫖</text>

      <rect x="250" y="0" width="210" height="170" rx="12" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="355" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2E7D73" text-anchor="middle">Chlorine Tablet</text>
      <text x="355" y="60" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">1 Tablet per 20L Water</text>
      <text x="355" y="80" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Wait 30 Mins Before Drinking</text>
      <text x="355" y="140" font-family="sans-serif" font-size="28" text-anchor="middle">💧</text>
    </g>
  </g>
</svg>
