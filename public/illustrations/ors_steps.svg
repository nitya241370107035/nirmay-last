<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" rx="16" fill="#F4F8F7"/>
  <g transform="translate(20, 20)">
    <!-- Step 1: Clean Water -->
    <g transform="translate(0, 20)">
      <rect x="10" y="20" width="110" height="180" rx="12" fill="#E0F2F1" stroke="#2E7D73" stroke-width="2"/>
      <path d="M 35 160 L 35 90 C 35 70, 95 70, 95 90 L 95 160 C 95 180, 35 180, 35 160 Z" fill="#B2DFD8" opacity="0.6" stroke="#00796B" stroke-width="2"/>
      <text x="65" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B4D4A" text-anchor="middle">1. 1 Liter</text>
      <text x="65" y="190" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Clean Water</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 145 120 L 175 120" stroke="#1B4D4A" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <!-- Step 2: ORS Sachet -->
    <g transform="translate(180, 20)">
      <rect x="10" y="20" width="110" height="180" rx="12" fill="#E0F2F1" stroke="#2E7D73" stroke-width="2"/>
      <rect x="40" y="70" width="50" height="70" rx="6" fill="#1B4D4A" stroke="#2E7D73" stroke-width="2"/>
      <text x="65" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#B2DFD8" text-anchor="middle">ORS</text>
      <text x="65" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B4D4A" text-anchor="middle">2. Pour All</text>
      <text x="65" y="190" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">WHO Sachet</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 305 120 L 335 120" stroke="#1B4D4A" stroke-width="3" stroke-linecap="round"/>

    <!-- Step 3: Stir Well -->
    <g transform="translate(340, 20)">
      <rect x="10" y="20" width="110" height="180" rx="12" fill="#E0F2F1" stroke="#2E7D73" stroke-width="2"/>
      <path d="M 40 150 L 40 90 C 40 80, 90 80, 90 90 L 90 150 Z" fill="#B2DFD8" stroke="#00796B" stroke-width="2"/>
      <line x1="75" y1="50" x2="65" y2="130" stroke="#1B4D4A" stroke-width="4" stroke-linecap="round"/>
      <text x="65" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B4D4A" text-anchor="middle">3. Stir Well</text>
      <text x="65" y="190" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Until Dissolved</text>
    </g>

    <!-- Step 4: Frequent Sips -->
    <g transform="translate(460, 20)">
      <rect x="0" y="20" width="110" height="180" rx="12" fill="#E0F2F1" stroke="#2E7D73" stroke-width="2"/>
      <circle cx="55" cy="100" r="30" fill="#2E7D73"/>
      <path d="M 45 100 Q 55 120 65 100" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="55" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1B4D4A" text-anchor="middle">4. Sip Small</text>
      <text x="55" y="190" font-family="sans-serif" font-size="12" fill="#37474F" text-anchor="middle">Frequent Drops</text>
    </g>
  </g>
</svg>
