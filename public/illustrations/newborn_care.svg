<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <rect width="600" height="300" rx="16" fill="#F4F8F7"/>
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="540" height="260" rx="16" fill="#E0F2F1" stroke="#2E7D73" stroke-width="2"/>
    <text x="270" y="35" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1B4D4A" text-anchor="middle">Newborn Care & SNCU Referral Danger Signs</text>
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="150" height="170" rx="12" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="75" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="middle">1. Poor Feeding</text>
      <text x="75" y="60" font-family="sans-serif" font-size="11" fill="#37474F" text-anchor="middle">Cannot breastfeed</text>
      <text x="75" y="80" font-family="sans-serif" font-size="11" fill="#37474F" text-anchor="middle">or weak suckling</text>
      <text x="75" y="140" font-family="sans-serif" font-size="28" text-anchor="middle">🍼</text>

      <rect x="180" y="0" width="150" height="170" rx="12" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="255" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="middle">2. High Fever/Cold</text>
      <text x="255" y="60" font-family="sans-serif" font-size="11" fill="#37474F" text-anchor="middle">&gt; 37.5°C or &lt; 35.5°C</text>
      <text x="255" y="80" font-family="sans-serif" font-size="11" fill="#37474F" text-anchor="middle">Body feels icy</text>
      <text x="255" y="140" font-family="sans-serif" font-size="28" text-anchor="middle">🌡️</text>

      <rect x="360" y="0" width="150" height="170" rx="12" fill="#FFFFFF" stroke="#2E7D73" stroke-width="2"/>
      <text x="435" y="30" font-family="sans-serif" font-size="14" font-weight="bold" fill="#B71C1C" text-anchor="middle">3. Fast Breathing</text>
      <text x="435" y="60" font-family="sans-serif" font-size="11" fill="#37474F" text-anchor="middle">&gt; 60 breaths/min</text>
      <text x="435" y="80" font-family="sans-serif" font-size="11" fill="#37474F" text-anchor="middle">Chest in-drawing</text>
      <text x="435" y="140" font-family="sans-serif" font-size="28" text-anchor="middle">🫁</text>
    </g>
  </g>
</svg>
